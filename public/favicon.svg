<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The board -->
  <rect width="32" height="32" rx="2" fill="#F2ECDC"/>
  <!-- Punched bound edge -->
  <circle cx="4.5" cy="9" r="1.4" fill="#DDD4BC"/>
  <circle cx="4.5" cy="23" r="1.4" fill="#DDD4BC"/>
  <!-- Ruled leaf -->
  <rect x="8.5" y="6" width="14" height="20" fill="#FBF8EF" stroke="#16171A" stroke-width="1"/>
  <rect x="10.5" y="9" width="10" height="1.6" fill="#16171A"/>
  <rect x="10.5" y="13" width="7" height="1.2" fill="#6B6A62"/>
  <rect x="10.5" y="16" width="10" height="1.2" fill="#6B6A62"/>
  <rect x="10.5" y="19" width="8" height="1.2" fill="#6B6A62"/>
  <!-- Divider tabs down the fore edge -->
  <rect x="23" y="5"  width="5" height="6" rx="1" fill="#1B4FA0"/>
  <rect x="23" y="12" width="5" height="6" rx="1" fill="#B44E15"/>
  <rect x="23" y="19" width="5" height="8" rx="1" fill="#37823C"/>
</svg>
